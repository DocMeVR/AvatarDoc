name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'Website~/**'
      - 'Editor/Localization/AvatarDoctor.en-US.po'
      - 'CHANGELOG.md'
      - 'Docs~/glossary.md'
      - 'Docs~/translating.md'
      - 'package.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: withastro/action@v6
        with:
          path: Website~
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
