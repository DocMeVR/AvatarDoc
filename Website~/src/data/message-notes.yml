# Notes for the Messages page: one "key: text" line per message, no quotes, lists or multi-line values.
# Add a note when the message text alone does not tell a creator what to do. Write UI labels in **bold**.
ad.info.target_shared: Nothing to fix when that is what you want. While both are on, the control AvatarDoc builds later wins, and triggers are built after every menu control. If the wrong one wins, give each control its own targets.
ad.info.target_shared_override: Nothing to fix when that is what you want. Otherwise take the shape out of the override, or out of the control.
ad.info.blend_ignored_in_group: Nothing to fix. A group switches its choices at once. To fade the toggle, take it out of its group.
ad.info.group_default_excluded: Nothing breaks. To start this platform with a choice on, give the toggle that is on by default a **Platform** that includes this platform.
ad.error.group_value_conflict: Select one of the two toggles and press **Give each member its own value** under the error. It numbers the members of the group 1, 2, 3 in the order of the menu, in one Undo step. Or change the number in **Value in group** on one of the two toggles.
ad.info.parameter_reused: Nothing to fix. To give the control a parameter of its own, turn off **Custom name**, or pick a name the avatar does not have yet.
ad.info.same_submenu_merged: Nothing to fix. To keep the submenu separate, give it another name.
ad.info.path_created: Nothing to fix. To install into a submenu the avatar already has, pick it with the arrow button beside **Install into** in **Component settings**.
ad.info.shape_set_pruned: Nothing to fix. The count says how many shapes the rule really writes.
ad.info.capture_nothing_above_zero: Set the pose first: in the mesh's Skinned Mesh Renderer, raise the weights of the shapes you want, then press **Capture** again.
ad.info.flip_target_excluded: Nothing to fix when the toggle is meant for the other platform only. Otherwise set the toggle's **Platform** so it is built here too.
ad.warn.follow_distance_tracking_left_to: Nothing to fix: the other layer already pauses that part. If blinking or lip sync keeps moving while the effects are on, check that layer.
ad.info.curve_overwritten: Nothing to fix when the trigger should win there. Otherwise give the trigger effects that the animation does not move.
ad.info.animation_overridden: Nothing to fix when the toggle's own rows should win. Otherwise remove those rows from the toggle and let the clip set the values.
ad.warn.animation_binding_missing: When the clip was made inside a prefab, set the row's **Path root** to the prefab's root object.
ad.error.menu_icon_too_large: Select the texture in the Project window. In its import settings, set **Max Size** to 256 and **Compression** to anything but None, then press Apply.
ad.warn.duplicate_entry_id: Nothing to fix. Select the object that holds the component in the Hierarchy once, and AvatarDoc gives the repeated ids new ones. The scene then shows as changed, so save it. Unlock the component first if it is locked.
ad.info.drop_refused: Nothing was moved. The reason after the colon says why. Unlock the component, drop onto a submenu that is not inside the row you are dragging, or drop onto a row that can hold other rows.
ad.info.grab_uses_existing_physbone: Nothing to fix. The PhysBone that is already on the object is used, and given a parameter name when it has none. To have AvatarDoc make its own, remove that PhysBone from the object.
ad.info.override_applied: Nothing to fix. The number says how many animations the override changed on the avatar that is built.
ad.info.removed_parameter: Nothing to fix. The item you removed was the last thing that used the parameter, so the parameter leaves the avatar and its synced bits are free. The summary lists it too.
ad.info.removed_kept: Nothing to fix. The reason after the colon names what still needs the parameter. If the reason names something you own, remove that as well.
ad.info.shape_set_count: Nothing to fix. The number is an upper limit. At upload, a shape that no animation moves is dropped from the rule, and a second note then says how many shapes the rule really holds.
ad.info.shapes_always_on: Nothing to fix when the piece should always wear these shapes. To switch them with the piece, add a toggle or an animation that turns the piece on and off.
ad.info.shapes_follow_kept_own: Nothing to fix when the animation's own values are what you want. To let the follow row write the shape there, remove that shape's curve from the animation.
ad.info.shapes_larger_wins: Nothing to fix when the larger value is what you want. Otherwise give both pieces the same value, or put their toggles in one exclusive group, so that only one piece is on at a time.
ad.info.shapes_never_on: Add a toggle, an outfit set or an animation that turns the object on, or take AvatarDoc Shapes off the piece. Leave it as it is for a piece that is meant to stay off.
ad.error.trigger_too_complex: The ways to turn the trigger off are the group sizes multiplied, and 64 is the most that builds. Four groups of 2 conditions come to 16 and build; four groups of 3 come to 81 and do not. Remove conditions from the biggest groups, or split the trigger in two. [Limits](../limits/#how-complex-a-trigger-may-be) has the table.
ad.warn.poiyomi_not_animated: Select the toggle, radial or trigger and press **Mark as animated** under the warning. It marks the property **Animated (when locked)** on the materials the warning names, in one Undo step, and the warning goes away. A locked component refuses it. You can also mark it in each material: right-click the property and choose **Animated (when locked)**. **Renamed (when locked)** works too: AvatarDoc then writes the value under both names. A material variant is named by the material it is made from, since Poiyomi locks that one, and the mark goes there.
ad.warn.poiyomi_baked: Select the material and press **Unlock Shader** at the top of its inspector. Right-click the property and choose **Animated (when locked)**. Then lock the material again, or leave it unlocked: Poiyomi locks it at upload. Once the material is unlocked, this warning becomes the one with the **Mark as animated** button, which does the marking for you.
ad.info.group_same_name: Nothing to fix when you want the two groups apart, such as a shop's outfits beside your own. To make them one group, select a toggle of either group and press **Join them** under the note, in one Undo step: the toggles of the component the note names second join the group of the one it names first. When only one of the two components is locked, the toggles of the other one move, so the button works. It is greyed out only while both are locked. [Groups of several components](../exclusive-groups/#several-components) explains what joining changes.
ad.warn.prefix_clash: Nothing breaks today: the build adds a number to tell the names apart. To keep saved values on the right toggles, select the component the warning names first and press **Give this component its own prefix** under the warning, or type another **Parameter prefix** in its **Component settings**. The toggles of that component then start from their defaults once, because their saved values were kept under the old names.
